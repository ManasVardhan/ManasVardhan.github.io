<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="idek: risk-coverage curve for abstention">
  <defs>
    <linearGradient id="id-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="id-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#id-bg)"/>

  <text x="64" y="104" class="mono" font-size="40" letter-spacing="6" fill="#71717b">ABSTENTION</text>

  <!-- big question mark node -->
  <g>
    <rect x="64" y="192" width="200" height="200" rx="44" fill="#1f1f23" stroke="#f59e0b" stroke-width="6"/>
    <text x="164" y="330" class="mono" font-size="128" fill="#f59e0b" text-anchor="middle">?</text>
  </g>

  <!-- axes -->
  <g stroke="#52525b" stroke-width="4">
    <line x1="440" y1="470" x2="1216" y2="470"/>
    <line x1="440" y1="150" x2="440" y2="470"/>
  </g>

  <!-- baseline -->
  <path d="M440 424 C 620 412, 800 350, 940 280 S 1140 176, 1216 152" fill="none" stroke="#52525b" stroke-width="7" stroke-dasharray="16 12"/>

  <!-- idek curve -->
  <path d="M440 456 C 660 452, 850 420, 990 356 S 1160 250, 1216 220 L 1216 470 L 440 470 Z" fill="url(#id-fill)"/>
  <path d="M440 456 C 660 452, 850 420, 990 356 S 1160 250, 1216 220" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>

  <text x="440" y="530" class="mono" font-size="38" fill="#71717b">coverage →</text>
  <text x="1216" y="530" class="mono" font-size="38" fill="#f59e0b" text-anchor="end">lower risk</text>

  <text x="64" y="622" class="sans" font-size="106" font-weight="600" fill="#fafafa">idek</text>
  <text x="1216" y="640" class="mono" font-size="44" fill="#a1a1aa" text-anchor="end">when not to answer</text>
</svg>
