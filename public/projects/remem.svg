    <circle cx="668" cy="258" r="13" fill="#fafafa"/>
    <rect x="704" y="246" width="330" height="24" rx="12" fill="#e4e4e7"/>
    <text x="1176" y="272" class="mono" font-size="42" fill="#a1a1aa" text-anchor="end">.94</text>
  </g>
  <g>
    <rect x="620" y="316" width="596" height="88" rx="20" fill="#1f1f23" stroke="#52525b" stroke-width="2"/>
    <circle cx="668" cy="360" r="13" fill="#fafafa"/>
    <rect x="704" y="348" width="256" height="24" rx="12" fill="#e4e4e7"/>
    <text x="1176" y="374" class="mono" font-size="42" fill="#a1a1aa" text-anchor="end">.88</text>
