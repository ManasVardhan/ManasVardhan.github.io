<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Predicting intent from multimodal screen context">
  <defs>
    <linearGradient id="pi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#pi-bg)"/>

  <text x="64" y="104" class="mono" font-size="40" letter-spacing="6" fill="#71717b">MULTIMODAL</text>

  <!-- stacked windows -->
  <g>
    <rect x="128" y="220" width="330" height="230" rx="24" fill="#141417" stroke="#3f3f46" stroke-width="3"/>
    <rect x="96" y="188" width="330" height="230" rx="24" fill="#1a1a1e" stroke="#52525b" stroke-width="3"/>
    <rect x="64" y="156" width="330" height="230" rx="24" fill="#1f1f23" stroke="#71717b" stroke-width="3"/>
    <line x1="64" y1="212" x2="394" y2="212" stroke="#3f3f46" stroke-width="3"/>
    <circle cx="96" cy="184" r="9" fill="#52525b"/>
    <circle cx="126" cy="184" r="9" fill="#52525b"/>
    <!-- OCR boxes -->
    <rect x="96" y="240" width="180" height="26" rx="7" fill="#27272a" stroke="#22d3ee" stroke-width="3"/>
    <rect x="96" y="284" width="266" height="22" rx="7" fill="#27272a" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="96" y="322" width="216" height="22" rx="7" fill="#27272a" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- arrow -->
  <path d="M436 300 L 596 300" stroke="#22d3ee" stroke-width="9" stroke-linecap="round"/>
  <path d="M576 280 L 600 300 L 576 320" fill="none" stroke="#22d3ee" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ranked intents -->
  <g>
    <rect x="640" y="164" width="576" height="82" rx="18" fill="#1f1f23" stroke="#22d3ee" stroke-width="4"/>
    <rect x="676" y="194" width="300" height="24" rx="12" fill="#e4e4e7"/>
    <text x="1180" y="214" class="mono" font-size="42" fill="#22d3ee" text-anchor="end">.82</text>
  </g>
  <g>
    <rect x="640" y="262" width="576" height="82" rx="18" fill="#1a1a1e" stroke="#3f3f46" stroke-width="3"/>
    <rect x="676" y="292" width="220" height="24" rx="12" fill="#71717b"/>
    <text x="1180" y="312" class="mono" font-size="42" fill="#71717b" text-anchor="end">.47</text>
  </g>
  <g>
    <rect x="640" y="360" width="576" height="82" rx="18" fill="#1a1a1e" stroke="#3f3f46" stroke-width="3"/>
    <rect x="676" y="390" width="160" height="24" rx="12" fill="#71717b"/>
    <text x="1180" y="410" class="mono" font-size="42" fill="#71717b" text-anchor="end">.29</text>
  </g>

  <text x="64" y="612" class="sans" font-size="74" font-weight="600" fill="#fafafa">Proactive Intent</text>
  <text x="64" y="664" class="mono" font-size="42" fill="#a1a1aa">predicted before the query</text>
</svg>
