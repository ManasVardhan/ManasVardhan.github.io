<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Seven published PyPI packages for LLM and agent infrastructure">
  <defs>
    <linearGradient id="py-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .pkg  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 40px; fill: #e4e4e7; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#py-bg)"/>

  <text x="64" y="104" class="mono" font-size="40" letter-spacing="6" fill="#71717b">PyPI</text>

  <g>
    <rect x="64" y="160" width="584" height="76" rx="18" fill="#1f1f23" stroke="#3f3f46" stroke-width="3"/>
    <text x="96" y="210" class="pkg">llm-shelter</text>
  </g>
  <g>
    <rect x="64" y="252" width="584" height="76" rx="18" fill="#1f1f23" stroke="#3f3f46" stroke-width="3"/>
    <text x="96" y="302" class="pkg">agent-trace-replay</text>
  </g>
  <g>
    <rect x="64" y="344" width="584" height="76" rx="18" fill="#1f1f23" stroke="#3f3f46" stroke-width="3"/>
    <text x="96" y="394" class="pkg">ai-agent-sentry</text>
  </g>
  <g>
    <rect x="64" y="436" width="584" height="76" rx="18" fill="#1f1f23" stroke="#3f3f46" stroke-width="3"/>
    <text x="96" y="486" class="pkg">llm-cost-guardian</text>
  </g>

  <g>
    <rect x="672" y="160" width="544" height="76" rx="18" fill="#1f1f23" stroke="#3f3f46" stroke-width="3"/>
    <text x="704" y="210" class="pkg">bench-my-llm</text>
  </g>
  <g>
    <rect x="672" y="252" width="544" height="76" rx="18" fill="#1f1f23" stroke="#3f3f46" stroke-width="3"/>
    <text x="704" y="302" class="pkg">llm-promptdiff</text>
  </g>
  <g>
    <rect x="672" y="344" width="544" height="76" rx="18" fill="#1f1f23" stroke="#3f3f46" stroke-width="3"/>
    <text x="704" y="394" class="pkg">mcp-server-forge</text>
  </g>

  <g>
    <rect x="672" y="436" width="544" height="76" rx="18" fill="#0f0f11" stroke="#52525b" stroke-width="3" stroke-dasharray="12 9"/>
    <text x="944" y="488" class="sans" font-size="44" font-weight="600" fill="#fafafa" text-anchor="middle">author &amp; maintainer</text>
  </g>

  <text x="64" y="622" class="sans" font-size="76" font-weight="600" fill="#fafafa">Agent Infra Suite</text>
  <text x="1216" y="600" class="sans" font-size="92" font-weight="600" fill="#fafafa" text-anchor="end">7</text>
  <text x="1216" y="648" class="mono" font-size="38" fill="#71717b" text-anchor="end">published packages</text>
</svg>
